name: mon_app_mobile
description: "Application de suivi personnel des actes de maieuticienne"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State management
  flutter_riverpod: ^2.6.1
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Charts
  fl_chart: ^0.69.2
  
  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.3
  
  # CSV export
  csv: ^6.0.0
  
  # Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  
  # Utilities
  path_provider: ^2.1.5
  intl: ^0.19.0
  share_plus: ^10.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true